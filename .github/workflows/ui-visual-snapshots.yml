name: UI visual snapshots

on:
  push:
    branches: [ui-fidelity-pass]
  pull_request:
    branches: [ui-fidelity-pass]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: Capture Prism and End Launcher screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory src > /tmp/end-launcher-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/end-launcher-http.log
          exit 1
      - name: Capture screenshots
        run: |
          mkdir -p artifacts/ui
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1,
          });
          const pageErrors = [];
          page.on('pageerror', (error) => {
            pageErrors.push(error.stack || error.message);
            console.error('PAGE ERROR:', error.stack || error.message);
          });

          // Mock only native Tauri services; all DOM/layout changes run through main.js itself.
          await page.addInitScript(() => {
            const responses = {
              get_settings: { username: 'Enderman', max_ram_mb: 2048 },
              get_theme: 'void',
              get_palette: null,
              get_accounts: { active: 'offline', microsoft: null, ely: null },
              get_ms_client_id: '',
              create_instance: { id: 'visual-test', name: 'Visual Test', version: '1.21.1', loader: 'fabric' },
              update_instance: { id: '1001', name: 'Renamed by visual test', version: '1.21.1', loader: 'fabric' },
              export_instance_to_path: '/tmp/end-launcher-visual-export.zip',
              pick_local_path: null,
              list_instances: [
                { id: 1001, name: 'Prism Preview - Fabric', version: '1.21.1', loader: 'fabric' },
                { id: 1002, name: 'Vanilla Preview', version: '1.20.1', loader: 'vanilla' },
                { id: 1003, name: 'NeoForge 1.21.1', version: '1.21.1', loader: 'neoforge' },
                { id: 1004, name: 'Quilt 1.20.1', version: '1.20.1', loader: 'quilt' },
                { id: 1005, name: 'Snapshot 26.1', version: '26.1-snapshot', loader: 'vanilla' },
                { id: 1006, name: 'Cobblemon Modpack', version: '1.21.1', loader: 'fabric' },
                { id: 1007, name: 'Better MC', version: '1.20.1', loader: 'forge' },
                { id: 1008, name: 'SkyFactory 4', version: '1.12.2', loader: 'forge' },
                { id: 1009, name: 'Adrenaline', version: '1.21.1', loader: 'fabric' },
                { id: 1010, name: 'Vanilla 1.21.11', version: '1.21.11', loader: 'vanilla' },
              ],
              get_active_instance: 1001,
              list_installed_versions: ['1.21.1', '1.20.1', '1.12.2', '26.1-snapshot', '1.21.11'],
              list_java_versions: [{ id: '1.21.11' }, { id: '1.21.1' }, { id: '1.20.1' }, { id: '1.12.2' }],
              list_mods: [],
              check_java: { source: 'managed', required_major: 21 },
              get_ui_style: 'prism',
              get_ai_enabled: false,
              ai_install_state: { llama: false, micro: false, advanced: false, llama_auto: false },
              detect_bedrock: { found: false, package_dir: '' },
              mc_news: [],
              p2p_status: { mode: 'off', info: '', peers: 0 },
              p2p_available: false,
              p2p_detect_port: null,
              has_api_key: false,
              get_advanced: { jvm_args: '', java_path: '' },
              get_startup_instance: null,
            };
            window.__TAURI_CALL_LOG = [];
            window.__TAURI__ = {
              core: {
                invoke: async (command, args) => {
                  window.__TAURI_CALL_LOG.push({ command, args: args || null });
                  if (command === 'pick_local_path' && args?.kind === 'export') return '/tmp/end-launcher-visual-export.zip';
                  if (command === 'export_instance_to_path') return args?.path || responses.export_instance_to_path;
                  return Object.prototype.hasOwnProperty.call(responses, command)
                    ? responses[command]
                    : null;
                },
              },
              event: {
                listen: async () => () => {},
              },
              window: {
                getCurrentWindow: () => ({
                  onDragDropEvent: async () => () => {},
                }),
              },
            };
            localStorage.setItem('el-first-run-complete', '1');
            localStorage.setItem('el-ui-style', 'prism');
            localStorage.setItem('el-ui-style-v2', 'prism');
            localStorage.setItem('end-launcher-prism-instance-groups-v1', JSON.stringify({
              1006: 'Modpack',
              1007: 'Modpack',
              1008: 'Modpack',
              1002: 'Vanilla-like',
              1009: 'Vanilla-like',
              1010: 'Vanilla-like',
            }));
          });

          await page.goto('http://127.0.0.1:4173/index.html?ui-test=1', {
            waitUntil: 'networkidle',
            timeout: 30000,
          });
          await page.waitForTimeout(900);

          // Hide onboarding only; use the real application functions for page/style state.
          await page.evaluate(async () => {
            document.getElementById('welcome-wizard')?.setAttribute('hidden', '');
            if (typeof window.__EL_TEST__?.chooseUi !== 'function' || typeof window.__EL_TEST__?.goPage !== 'function') {
              throw new Error('Test bridge was not enabled by ?ui-test=1.');
            }
            await window.__EL_TEST__.chooseUi('prism');
            window.__EL_TEST__.goPage('play');
          });
          await page.waitForTimeout(400);

          const prismState = await page.evaluate(() => ({
            ui: document.documentElement.dataset.ui,
            pageActive: document.getElementById('page-play')?.classList.contains('active'),
            layout: document.getElementById('library')?.dataset.layout,
            playUiParent: document.getElementById('play-ui')?.parentElement?.id,
            sidebarVisible: !!document.querySelector('.sidebar')
              && getComputedStyle(document.querySelector('.sidebar')).display !== 'none',
            bodyTextLength: (document.body.innerText || '').trim().length,
            instanceTiles: document.querySelectorAll('#library .inst-card:not(.add):not([hidden])').length,
            groupHeadings: document.querySelectorAll('#library .library-group-heading').length,
            navButtons: document.querySelectorAll('.nav-btn').length,
          }));
          console.log('PRISM UI ASSERTIONS:', JSON.stringify(prismState));
          if (prismState.ui !== 'prism'
              || !prismState.pageActive
              || prismState.layout !== 'prism'
              || prismState.playUiParent !== 'slot-bar'
              || !prismState.sidebarVisible
              || prismState.bodyTextLength < 80
              || prismState.instanceTiles < 8
              || prismState.groupHeadings < 3
              || prismState.navButtons < 3) {
            throw new Error('Prism UI did not render correctly; refusing to publish misleading screenshots.');
          }
          if (pageErrors.length) {
            throw new Error(`Prism page emitted ${pageErrors.length} JavaScript error(s).`);
          }

          const prismGeometry = await page.evaluate(() => {
            const card = document.querySelector('#library .inst-card.active:not(.add)');
            const icon = card?.querySelector(':scope > .inst-icon');
            const label = card?.querySelector(':scope > .inst-name');
            const add = document.querySelector('.sidebar #library-add');
            const sidebar = document.querySelector('.sidebar');
            const fab = document.getElementById('p2p-fab');
            const status = document.querySelector('.prism-status-bar');
            const pet = document.querySelector('.pet');
            const cardRect = card?.getBoundingClientRect();
            const iconRect = icon?.getBoundingClientRect();
            const labelRect = label?.getBoundingClientRect();
            const labelLineClamp = label ? getComputedStyle(label).webkitLineClamp : 'missing';
            const fabRect = fab?.getBoundingClientRect();
            const statusRect = status?.getBoundingClientRect();
            return {
              cardDisplay: card ? getComputedStyle(card).display : 'missing',
              cardDirection: card ? getComputedStyle(card).flexDirection : 'missing',
              labelBelowIcon: !!iconRect && !!labelRect && labelRect.top >= iconRect.bottom - 1,
              labelLineClamp,
              labelInsideCard: !!cardRect && !!labelRect
                && labelRect.left >= cardRect.left - 1 && labelRect.right <= cardRect.right + 1,
              addAfterContent: add ? getComputedStyle(add, '::after').content : 'missing',
              sidebarOverflow: !!sidebar && sidebar.scrollWidth > sidebar.clientWidth + 2,
              petDisplay: pet ? getComputedStyle(pet).display : 'missing',
              p2pInOverflow: fab?.parentElement?.id === 'prism-toolbar-overflow',
              p2pPosition: fab ? getComputedStyle(fab).position : 'missing',
              documentOverflow: document.documentElement.scrollWidth > window.innerWidth + 2,
            };
          });
          console.log('PRISM DESKTOP GEOMETRY:', JSON.stringify(prismGeometry));
          if (prismGeometry.cardDisplay !== 'flex'
              || prismGeometry.cardDirection !== 'column'
              || !prismGeometry.labelBelowIcon
              || prismGeometry.labelLineClamp !== '2'
              || !prismGeometry.labelInsideCard
              || prismGeometry.addAfterContent !== 'none'
              || prismGeometry.sidebarOverflow
              || prismGeometry.petDisplay !== 'none'
              || !prismGeometry.p2pInOverflow
              || prismGeometry.p2pPosition !== 'static'
              || prismGeometry.documentOverflow) {
            throw new Error('Prism desktop geometry is broken; refusing to publish misleading screenshots.');
          }

          // Assert the literal left-to-right order from the user's Pinecone reference screenshot.
          const toolbarOrder = await page.evaluate(() => {
            const ids = ['prism-help', 'prism-update', 'library-add', 'prism-open-folder', 'nav-settings-button'];
            return ids.map((id) => {
              const el = document.getElementById(id);
              const rect = el?.getBoundingClientRect();
              const style = el ? getComputedStyle(el) : null;
              return { id, left: rect?.left ?? null, right: rect?.right ?? null, visible: !!rect && rect.width > 0 && rect.height > 0 && style.display !== 'none' };
            });
          });
          console.log('PRISM TOOLBAR ORDER:', JSON.stringify(toolbarOrder));
          if (toolbarOrder.some((item) => !item.visible)
              || toolbarOrder.some((item, index) => index > 0 && item.left < toolbarOrder[index - 1].left)) {
            throw new Error('Prism toolbar buttons do not match the Pinecone reference order: Help, Update, Add, Folders, Settings.');
          }

          await page.mouse.move(820, 450);
          await page.screenshot({
            path: 'artifacts/ui/prism-pinecone-desktop.png',
            fullPage: true,
          });
          await page.setViewportSize({ width: 390, height: 844 });
          await page.mouse.move(320, 420);
          await page.waitForTimeout(250);
          const prismMobileGeometry = await page.evaluate(() => {
            const root = document.documentElement;
            const layout = document.querySelector('.layout');
            const sidebar = document.querySelector('.sidebar');
            const main = document.querySelector('.content main');
            const playbar = document.querySelector('.playbar');
            const status = document.querySelector('.prism-status-bar');
            const fab = document.getElementById('p2p-fab');
            const pet = document.querySelector('.pet');
            const rect = (element) => {
              if (!element) return null;
              const r = element.getBoundingClientRect();
              return { top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
            };
            const activeCard = document.querySelector('#library .inst-card.active:not(.add)');
            const iconRect = rect(activeCard?.querySelector(':scope > .inst-icon'));
            const labelRect = rect(activeCard?.querySelector(':scope > .inst-name'));
            return {
              viewportWidth: innerWidth,
              documentWidth: root.scrollWidth,
              layout: rect(layout),
              sidebar: rect(sidebar),
              main: rect(main),
              playbar: rect(playbar),
              status: rect(status),
              p2pFab: rect(fab),
              petDisplay: pet ? getComputedStyle(pet).display : 'missing',
              p2pInOverflow: fab?.parentElement?.id === 'prism-toolbar-overflow',
              p2pPosition: fab ? getComputedStyle(fab).position : 'missing',
              tileColumn: activeCard ? getComputedStyle(activeCard).flexDirection : 'missing',
              labelLineClamp: activeCard ? getComputedStyle(activeCard.querySelector(':scope > .inst-name')).webkitLineClamp : 'missing',
              labelBelowIcon: !!iconRect && !!labelRect && labelRect.top >= iconRect.bottom - 1,
              playbarContained: !!playbar && playbar.scrollWidth <= playbar.clientWidth + 2,
              playbarVerticalFit: !!playbar && playbar.scrollHeight <= playbar.clientHeight + 2,
              playbarScrollHeight: playbar?.scrollHeight ?? 0,
              playbarClientHeight: playbar?.clientHeight ?? 0,
              layoutContained: !!layout && layout.scrollWidth <= layout.clientWidth + 2,
            };
          });
          console.log('PRISM MOBILE GEOMETRY:', JSON.stringify(prismMobileGeometry));
          const mobilePlaybar = prismMobileGeometry.playbar;
          const mobileStatus = prismMobileGeometry.status;
          if (prismMobileGeometry.documentWidth > 392
              || prismMobileGeometry.tileColumn !== 'column'
              || prismMobileGeometry.labelLineClamp !== '2'
              || !prismMobileGeometry.labelBelowIcon
              || !prismMobileGeometry.playbarContained
              || !prismMobileGeometry.playbarVerticalFit
              || !prismMobileGeometry.layoutContained
              || prismMobileGeometry.petDisplay !== 'none'
              || !prismMobileGeometry.p2pInOverflow
              || prismMobileGeometry.p2pPosition !== 'static'
              || !mobilePlaybar || !mobileStatus
              || mobilePlaybar.right > 392
              || mobileStatus.right > 392
              || mobilePlaybar.bottom > mobileStatus.top + 2
              || mobileStatus.bottom > 846) {
            throw new Error('Prism mobile layout overflows or clips the launch/status panels; refusing to publish screenshots.');
          }
          await page.screenshot({
            path: 'artifacts/ui/prism-pinecone-mobile.png',
            fullPage: true,
          });


          // Exercise the newly added in-app instance wizard, import hand-off, provider actions and settings tabs.
          await page.setViewportSize({ width: 1440, height: 900 });
          await page.evaluate(async () => { await window.__EL_TEST__.openNewInstance(); });
          await page.waitForTimeout(120);
          const wizardState = await page.evaluate(() => ({
            visible: getComputedStyle(document.getElementById('new-instance')).display !== 'none',
            title: document.getElementById('create-instance-title')?.textContent,
            sidebarButtons: document.querySelectorAll('[data-create-view]').length,
            overlayRect: (() => { const r = document.getElementById('new-instance').getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; })(),
            minecraftPanelVisible: !document.querySelector('[data-create-panel="minecraft"]')?.hidden,
            importPanelHidden: !!document.querySelector('[data-create-panel="import"]')?.hidden,
            versionOptions: document.getElementById('ni-version')?.options.length || 0,
          }));
          console.log('PRISM CREATE WIZARD ASSERTIONS:', JSON.stringify(wizardState));
          if (!wizardState.visible || wizardState.title !== 'Добавить экземпляр'
              || wizardState.sidebarButtons !== 4 || !wizardState.minecraftPanelVisible
              || !wizardState.importPanelHidden || wizardState.versionOptions < 1
              || Math.abs(wizardState.overlayRect.left) > 1 || Math.abs(wizardState.overlayRect.top) > 1
              || Math.abs(wizardState.overlayRect.width - 1440) > 2
              || Math.abs(wizardState.overlayRect.height - 900) > 2) {
            throw new Error('Prism Add Instance wizard did not initialize its in-app tabs and version choices.');
          }
          await page.screenshot({ path: 'artifacts/ui/prism-add-instance.png', fullPage: true });

          await page.locator('#ni-name').fill('Visual Test');
          await page.locator('#ni-group').fill('Survival Test');
          await page.locator('#ni-create').click();
          await page.waitForFunction(() => {
            try { return JSON.parse(localStorage.getItem('end-launcher-prism-instance-groups-v1') || '{}')['visual-test'] === 'Survival Test'; }
            catch { return false; }
          }, null, { timeout: 3000 });
          const createCall = await page.evaluate(() => window.__TAURI_CALL_LOG.some((entry) =>
            entry.command === 'create_instance'
              && entry.args?.name === 'Visual Test'
              && entry.args?.version === document.getElementById('ni-version')?.value
              && entry.args?.loader === document.getElementById('ni-loader')?.value));
          if (!createCall) throw new Error('Create Instance did not call the native create_instance action.');
          await page.waitForFunction(() => getComputedStyle(document.getElementById('new-instance')).display === 'none');
          await page.evaluate(async () => { await window.__EL_TEST__.openNewInstance(); });

          await page.locator('[data-create-view="import"]').click();
          const importVisible = await page.locator('[data-create-panel="import"]').evaluate((el) => !el.hidden);
          if (!importVisible) throw new Error('Prism Import panel did not open.');
          await page.locator('#ni-import-start').click();
          const importGuideOpened = await page.locator('#library-import-guide').evaluate((el) => getComputedStyle(el).display !== 'none');
          const dialogClosed = await page.locator('#new-instance').evaluate((el) => getComputedStyle(el).display === 'none');
          if (!importGuideOpened || !dialogClosed) throw new Error('Prism Import action did not hand off to the native drag/drop import flow.');
          await page.locator('#library-import-close').click();

          await page.evaluate(async () => { await window.__EL_TEST__.openNewInstance(); });
          await page.locator('[data-create-view="modrinth"]').click();
          await page.locator('#ni-open-modrinth').click();
          const modrinthOpened = await page.evaluate(() =>
            window.__TAURI_CALL_LOG.some((entry) => entry.command === 'open_url' && entry.args?.url === 'https://modrinth.com/modpacks'));
          if (!modrinthOpened) throw new Error('Modrinth provider button did not call the launcher open-url action.');
          await page.locator('[data-create-view="curseforge"]').click();
          await page.locator('#ni-open-curseforge').click();
          const curseforgeOpened = await page.evaluate(() =>
            window.__TAURI_CALL_LOG.some((entry) => entry.command === 'open_url' && entry.args?.url === 'https://www.curseforge.com/minecraft/search?class=modpacks'));
          if (!curseforgeOpened) throw new Error('CurseForge provider button did not call the launcher open-url action.');
          await page.evaluate(() => window.__EL_TEST__.closeNewInstance());
          await page.evaluate(async () => {
            await window.__EL_TEST__.exportInstanceWithDialog({ id: '1001', name: 'Prism Preview - Fabric' });
          });
          const exportDialogUsed = await page.evaluate(() => {
            const picker = window.__TAURI_CALL_LOG.find((entry) => entry.command === 'pick_local_path' && entry.args?.kind === 'export');
            const save = window.__TAURI_CALL_LOG.find((entry) => entry.command === 'export_instance_to_path');
            return picker && save && save.args?.id === '1001' && save.args?.path === '/tmp/end-launcher-visual-export.zip';
          });
          if (!exportDialogUsed) throw new Error('Prism Export action did not use the native Save As path and export command.');


          await page.locator('#nav-settings-button').click();
          const settingsVisible = await page.evaluate(() => ({
            pageActive: document.getElementById('page-settings')?.classList.contains('active'),
            tabsVisible: !document.getElementById('prism-settings-tabs')?.hidden,
            selectedTab: document.querySelector('[data-prism-settings-tab][aria-selected="true"]')?.dataset.prismSettingsTab,
            generalVisible: !document.querySelector('[data-prism-settings-section="general"]')?.hidden,
            javaHidden: !!document.querySelector('[data-prism-settings-section="java"]')?.hidden,
          }));
          console.log('PRISM SETTINGS ASSERTIONS:', JSON.stringify(settingsVisible));
          if (!settingsVisible.pageActive || !settingsVisible.tabsVisible
              || settingsVisible.selectedTab !== 'general' || !settingsVisible.generalVisible
              || !settingsVisible.javaHidden) {
            throw new Error('Prism Parameters did not switch to the tabbed in-app settings page.');
          }
          await page.waitForTimeout(500); // Wait for the application page transition animation before capturing.
          await page.screenshot({ path: 'artifacts/ui/prism-settings-general.png', fullPage: true });
          await page.locator('[data-prism-settings-tab="java"]').click();
          const javaState = await page.evaluate(() => ({
            selected: document.querySelector('[data-prism-settings-tab][aria-selected="true"]')?.dataset.prismSettingsTab,
            javaVisible: !document.querySelector('[data-prism-settings-section="java"]')?.hidden,
            generalHidden: !!document.querySelector('[data-prism-settings-section="general"]')?.hidden,
          }));
          if (javaState.selected !== 'java' || !javaState.javaVisible || !javaState.generalHidden) {
            throw new Error('Prism Java settings tab did not filter the settings panel correctly.');
          }
          await page.screenshot({ path: 'artifacts/ui/prism-settings-java.png', fullPage: true });
          await page.locator('[data-prism-settings-tab="appearance"]').click();
          const appearanceVisible = await page.locator('#catpack-settings').evaluate((el) => !el.hidden);
          if (!appearanceVisible) throw new Error('Prism appearance settings did not expose the cat/background controls.');
          await page.screenshot({ path: 'artifacts/ui/prism-settings-appearance.png', fullPage: true });

          // The Java page must wire automatic selection, file browsing, and a real version check.
          await page.locator('[data-prism-settings-tab="java"]').click();
          await page.locator('#adv-java-check').click();
          const javaCheckCalled = await page.evaluate(() =>
            window.__TAURI_CALL_LOG.some((entry) => entry.command === 'check_java' && entry.args?.id === '1.21.1'));
          if (!javaCheckCalled) throw new Error('Prism Java check did not query the selected Minecraft version.');
          await page.locator('#adv-java-browse').click();
          const javaPickerCalled = await page.evaluate(() =>
            window.__TAURI_CALL_LOG.some((entry) => entry.command === 'pick_local_path' && entry.args?.kind === 'java'));
          if (!javaPickerCalled) throw new Error('Java browse button did not use the native path picker.');

          // Verify the instance editor opens as a viewport modal and persists edits through Rust.
          await page.evaluate(() => window.__EL_TEST__.openPrismInstanceEditor(
            { id: '1001', name: 'Prism Preview - Fabric', version: '1.21.1', loader: 'fabric' }, null, null));
          const editModalState = await page.evaluate(() => {
            const overlay = document.getElementById('prism-instance-editor-modal');
            const rect = overlay?.getBoundingClientRect();
            return {
              visible: !!overlay && getComputedStyle(overlay).display !== 'none',
              ariaModal: overlay?.querySelector('[role="dialog"]')?.getAttribute('aria-modal'),
              fields: overlay?.querySelectorAll('input,select').length || 0,
              rect: rect ? { left: rect.left, top: rect.top, width: rect.width, height: rect.height } : null,
            };
          });
          if (!editModalState.visible || editModalState.ariaModal !== 'true' || editModalState.fields !== 4
              || Math.abs(editModalState.rect.left) > 1 || Math.abs(editModalState.rect.top) > 1
              || Math.abs(editModalState.rect.width - 1440) > 2
              || Math.abs(editModalState.rect.height - 900) > 2) {
            throw new Error('Prism instance editor modal did not initialize at the full viewport.');
          }
          await page.screenshot({ path: 'artifacts/ui/prism-edit-instance.png', fullPage: true });
          await page.locator('#prism-instance-editor-modal [aria-label="Имя экземпляра"]').fill('Renamed by visual test');
          await page.locator('#prism-instance-editor-modal [aria-label="Группа экземпляра"]').fill('Edited Group');
          await page.locator('#prism-instance-editor-modal .prism-instance-save').click();
          await page.waitForFunction(() => {
            try { return JSON.parse(localStorage.getItem('end-launcher-prism-instance-groups-v1') || '{}')['1001'] === 'Edited Group'; }
            catch { return false; }
          }, null, { timeout: 3000 });
          const updateCall = await page.evaluate(() => window.__TAURI_CALL_LOG.some((entry) =>
            entry.command === 'update_instance'
              && entry.args?.id === '1001'
              && entry.args?.name === 'Renamed by visual test'
              && entry.args?.version === '1.21.1'
              && entry.args?.loader === 'fabric'));
          if (!updateCall) throw new Error('Prism instance editor did not invoke update_instance.');
          await page.waitForFunction(() => !document.getElementById('prism-instance-editor-modal'));

          await page.evaluate(async () => { await window.__EL_TEST__.openNewInstance(); });
          await page.locator('[data-create-view="import"]').click();
          await page.locator('#ni-import-archive').click();
          const archivePickerCalled = await page.evaluate(() =>
            window.__TAURI_CALL_LOG.some((entry) => entry.command === 'pick_local_path' && entry.args?.kind === 'archive'));
          const cancelledImportMessage = await page.locator('#ni-msg').textContent();
          if (!archivePickerCalled || !cancelledImportMessage.includes('Выбор отменён')) {
            throw new Error('Prism archive picker did not call the native command or handle cancellation.');
          }
          await page.locator('#ni-import-folder').click();
          const folderPickerCalled = await page.evaluate(() =>
            window.__TAURI_CALL_LOG.some((entry) => entry.command === 'pick_local_path' && entry.args?.kind === 'folder'));
          if (!folderPickerCalled) throw new Error('Prism folder picker did not call the native command.');
          await page.evaluate(() => window.__EL_TEST__.closeNewInstance());


          await page.setViewportSize({ width: 1440, height: 900 });
          await page.evaluate(async () => {
            await window.__EL_TEST__.chooseUi('end');
            window.__EL_TEST__.goPage('play');
          });
          await page.waitForTimeout(300);
          const endState = await page.evaluate(() => ({
            ui: document.documentElement.dataset.ui,
            layout: document.getElementById('library')?.dataset.layout,
            playUiParent: document.getElementById('play-ui')?.parentElement?.id,
          }));
          console.log('END UI ASSERTIONS:', JSON.stringify(endState));
          if (endState.ui !== 'end'
              || endState.layout !== 'end'
              || endState.playUiParent !== 'slot-page') {
            throw new Error('End Launcher classic UI did not switch back correctly.');
          }
          if (pageErrors.length) {
            throw new Error(`UI emitted ${pageErrors.length} JavaScript error(s).`);
          }
          await page.mouse.move(1200, 450);
          await page.screenshot({
            path: 'artifacts/ui/end-classic-desktop.png',
            fullPage: true,
          });

          await browser.close();
          NODE
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-launcher-ui-screenshots
          path: artifacts/ui/
          if-no-files-found: warn
          retention-days: 14
