name: UI visual snapshots

on:
  push:
    branches: [ui-fidelity-pass]
  pull_request:
    branches: [ui-fidelity-pass]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: Capture Prism and End Launcher screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory src > /tmp/end-launcher-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/end-launcher-http.log
          exit 1
      - name: Capture screenshots
        run: |
          mkdir -p artifacts/ui
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          await page.addInitScript(() => {
            window.__TAURI__ = { core: { invoke: async () => null } };
            localStorage.setItem('el-first-run-complete', '1');
            localStorage.setItem('el-ui-style', 'prism');
            localStorage.setItem('el-ui-style-v2', 'prism');
          });
          page.on('pageerror', error => console.error('PAGE ERROR:', error.message));
          await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle', timeout: 30000 });
          await page.waitForTimeout(1200);
          // Explicitly apply Prism through the actual settings card if present, then return to Play.
          const settingsNav = page.locator('#nav-settings-button');
          if (await settingsNav.count()) await settingsNav.click();
          const prismCard = page.locator('#ui-styles .theme-card').filter({ hasText: 'Prism / PineconeMC' }).first();
          if (await prismCard.count()) await prismCard.click();
          await page.waitForTimeout(700);
          const playNav = page.locator('.nav-btn[data-page="play"]').first();
          if (await playNav.count()) await playNav.click();
          await page.waitForTimeout(1200);
          await page.screenshot({ path: 'artifacts/ui/prism-pinecone-desktop.png', fullPage: true });
          await page.setViewportSize({ width: 390, height: 844 });
          await page.waitForTimeout(500);
          await page.screenshot({ path: 'artifacts/ui/prism-pinecone-mobile.png', fullPage: true });
          // Also capture the classic End layout for comparison.
          await page.setViewportSize({ width: 1440, height: 900 });
          await page.locator('#nav-settings-button').click();
          const endCard = page.locator('#ui-styles .theme-card').filter({ hasText: 'End (классический)' }).first();
          if (await endCard.count()) await endCard.click();
          await page.locator('.nav-btn[data-page="play"]').first().click();
          await page.waitForTimeout(700);
          await page.screenshot({ path: 'artifacts/ui/end-classic-desktop.png', fullPage: true });
          await browser.close();
          NODE
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: end-launcher-ui-screenshots
          path: artifacts/ui/
          if-no-files-found: warn
          retention-days: 14
