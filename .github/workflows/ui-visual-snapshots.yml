name: UI visual snapshots

on:
  push:
    branches: [ui-fidelity-pass]
  pull_request:
    branches: [ui-fidelity-pass]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: Capture Prism, Modrinth and End Launcher screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory src > /tmp/end-launcher-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/end-launcher-http.log
          exit 1
      - name: Capture screenshots
        run: |
          mkdir -p artifacts/ui
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1,
          });
          const pageErrors = [];
          page.on('pageerror', (error) => {
            pageErrors.push(error.stack || error.message);
            console.error('PAGE ERROR:', error.stack || error.message);
          });

          // Mock only native Tauri services; all DOM/layout changes run through main.js itself.
          await page.addInitScript(() => {
            const responses = {
              get_settings: { username: 'Enderman', max_ram_mb: 2048 },
              get_theme: 'void',
              get_palette: null,
              get_accounts: { active: 'offline', microsoft: null, ely: null },
              get_ms_client_id: '',
              create_instance: { id: 'visual-test', name: 'Visual Test', version: '1.21.1', loader: 'fabric' },
              update_instance: { id: '1001', name: 'Renamed by visual test', version: '1.21.1', loader: 'fabric' },
              export_instance_to_path: '/tmp/end-launcher-visual-export.zip',
              pick_local_path: null,
              list_instances: [
                { id: 1001, name: 'Prism Preview - Fabric', version: '1.21.1', loader: 'fabric' },
                { id: 1002, name: 'Vanilla Preview', version: '1.20.1', loader: 'vanilla' },
                { id: 1003, name: 'NeoForge 1.21.1', version: '1.21.1', loader: 'neoforge' },
                { id: 1004, name: 'Quilt 1.20.1', version: '1.20.1', loader: 'quilt' },
                { id: 1005, name: 'Snapshot 26.1', version: '26.1-snapshot', loader: 'vanilla' },
                { id: 1006, name: 'Cobblemon Modpack', version: '1.21.1', loader: 'fabric' },
                { id: 1007, name: 'Better MC', version: '1.20.1', loader: 'forge' },
                { id: 1008, name: 'SkyFactory 4', version: '1.12.2', loader: 'forge' },
                { id: 1009, name: 'Adrenaline', version: '1.21.1', loader: 'fabric' },
                { id: 1010, name: 'Vanilla 1.21.11', version: '1.21.11', loader: 'vanilla' },
              ],
              get_active_instance: 1001,
              list_installed_versions: ['1.21.1', '1.20.1', '1.12.2', '26.1-snapshot', '1.21.11'],
              list_java_versions: [
                { id: '1.21.11', kind: 'release', release_time: '2025-12-09T12:00:00+00:00' },
                { id: '1.21.1', kind: 'release', release_time: '2024-06-13T12:00:00+00:00' },
                { id: '26.1-snapshot', kind: 'snapshot', release_time: '2026-01-07T12:00:00+00:00' },
                { id: 'b1.7.3', kind: 'old_beta', release_time: '2011-07-08T12:00:00+00:00' },
              ],
              list_mods: [],
              check_java: { source: 'managed', required_major: 21 },
              get_ui_style: 'prism',
              get_ai_enabled: false,
              ai_install_state: { llama: false, micro: false, advanced: false, llama_auto: false },
              detect_bedrock: { found: false, package_dir: '' },
              mc_news: [],
              p2p_status: { mode: 'off', info: '', peers: 0 },
              p2p_available: false,
              p2p_detect_port: null,
              has_api_key: false,
              get_advanced: { jvm_args: '', java_path: '' },
              get_startup_instance: null,
            };
            window.__TAURI_CALL_LOG = [];
            window.__TAURI__ = {
              core: {
                invoke: async (command, args) => {
                  window.__TAURI_CALL_LOG.push({ command, args: args || null });
                  if (command === 'pick_local_path' && args?.kind === 'export') return '/tmp/end-launcher-visual-export.zip';
                  if (command === 'export_instance_to_path') return args?.path || responses.export_instance_to_path;
                  if (command === 'modrinth_search') return args?.projectType === 'modpack' ? [
                    { slug: 'prominence-ii-rpg', title: 'Prominence II RPG', description: 'An adventure-focused pack with quests, exploration and progression.', downloads: 1200000, icon_url: 'https://cdn.modrinth.com/data/prominence/icon.png' },
                    { slug: 'cobblemon', title: 'Cobblemon Official Modpack', description: 'Explore a blocky world with creatures, battles and a new adventure.', downloads: 850000, icon_url: 'https://cdn.modrinth.com/data/cobblemon/icon.png' },
                  ] : [];
                  if (command === 'list_loader_versions') return args?.loader === 'forge'
                    ? [{ version: '52.0.16', channel: 'Recommended' }, { version: '52.0.15', channel: 'Release' }]
                    : args?.loader === 'quilt'
                      ? [{ version: '0.29.0', channel: 'Stable' }, { version: '0.28.1', channel: 'Stable' }]
                      : args?.loader === 'neoforge'
                        ? [{ version: '21.1.200', channel: 'Release' }, { version: '21.1.199', channel: 'Release' }]
                        : [{ version: '0.16.10', channel: 'Stable' }, { version: '0.16.9', channel: 'Stable' }];
                  return Object.prototype.hasOwnProperty.call(responses, command)
                    ? responses[command]
                    : null;
                },
              },
              event: {
                listen: async () => () => {},
              },
              window: {
                getCurrentWindow: () => ({
                  onDragDropEvent: async () => () => {},
                }),
              },
            };
            localStorage.setItem('el-first-run-complete', '1');
            localStorage.setItem('end-launcher-prism-play-stats-v1', JSON.stringify({
              1001: { totalMs: 7200000, lastPlayedAt: Date.now() - 3600000, lastSessionMs: 1800000 },
              1002: { totalMs: 6300000, lastPlayedAt: Date.now() - 7200000, lastSessionMs: 1500000 },
              1003: { totalMs: 5400000, lastPlayedAt: Date.now() - 10800000, lastSessionMs: 1200000 },
              1004: { totalMs: 4500000, lastPlayedAt: Date.now() - 14400000, lastSessionMs: 900000 },
              1005: { totalMs: 3600000, lastPlayedAt: Date.now() - 18000000, lastSessionMs: 600000 },
              1006: { totalMs: 3600000, lastPlayedAt: Date.now() - 7200000, lastSessionMs: 900000 },
            }));
            localStorage.setItem('el-ui-style', 'prism');
            localStorage.setItem('el-ui-style-v2', 'prism');
            localStorage.setItem('end-launcher-prism-instance-groups-v1', JSON.stringify({
              1006: 'Modpack',
              1007: 'Modpack',
              1008: 'Modpack',
              1002: 'Vanilla-like',
              1009: 'Vanilla-like',
              1010: 'Vanilla-like',
            }));
          });

          await page.goto('http://127.0.0.1:4173/index.html?ui-test=1', {
            waitUntil: 'networkidle',
            timeout: 30000,
          });
          await page.waitForTimeout(900);

          // Hide onboarding only; use the real application functions for page/style state.
          await page.evaluate(async () => {
            document.getElementById('welcome-wizard')?.setAttribute('hidden', '');
            if (typeof window.__EL_TEST__?.chooseUi !== 'function' || typeof window.__EL_TEST__?.goPage !== 'function') {
              throw new Error('Test bridge was not enabled by ?ui-test=1.');
            }
            // Switch from the ordinary Settings page into Prism. The selected shell must
            // replace that page itself; the test must not navigate home on its own.
            await window.__EL_TEST__.chooseUi('end');
            window.__EL_TEST__.goPage('settings');
            await window.__EL_TEST__.chooseUi('prism');
          });
          await page.waitForTimeout(400);

          const prismState = await page.evaluate(() => ({
            ui: document.documentElement.dataset.ui,
            pageActive: document.getElementById('page-play')?.classList.contains('active'),
            settingsPageActive: document.getElementById('page-settings')?.classList.contains('active'),
            prismSettingsOpen: document.documentElement.classList.contains('prism-settings-open'),
            statusHasEndBranding: (document.querySelector('.prism-status-news-row')?.innerText || '').includes('End Launcher'),
            endLogoTextDisplay: getComputedStyle(document.querySelector('.logo-text')).display,
            layout: document.getElementById('library')?.dataset.layout,
            playUiParent: document.getElementById('play-ui')?.parentElement?.id,
            sidebarVisible: !!document.querySelector('.sidebar')
              && getComputedStyle(document.querySelector('.sidebar')).display !== 'none',
            bodyTextLength: (document.body.innerText || '').trim().length,
            instanceTiles: document.querySelectorAll('#library .inst-card:not(.add):not([hidden])').length,
            groupHeadings: document.querySelectorAll('#library .library-group-heading').length,
            navButtons: document.querySelectorAll('.nav-btn').length,
          }));
          console.log('PRISM UI ASSERTIONS:', JSON.stringify(prismState));
          if (prismState.ui !== 'prism'
              || !prismState.pageActive
              || prismState.settingsPageActive
              || prismState.prismSettingsOpen
              || prismState.statusHasEndBranding
              || prismState.endLogoTextDisplay !== 'none'
              || prismState.layout !== 'prism'
              || prismState.playUiParent !== 'slot-bar'
              || !prismState.sidebarVisible
              || prismState.bodyTextLength < 80
              || prismState.instanceTiles < 8
              || prismState.groupHeadings < 3
              || prismState.navButtons < 3) {
            throw new Error('Prism UI did not render correctly; refusing to publish misleading screenshots.');
          }
          if (pageErrors.length) {
            throw new Error(`Prism page emitted ${pageErrors.length} JavaScript error(s).`);
          }

          const prismGeometry = await page.evaluate(() => {
            const card = document.querySelector('#library .inst-card.active:not(.add)');
            const icon = card?.querySelector(':scope > .inst-icon');
            const label = card?.querySelector(':scope > .inst-name');
            const add = document.querySelector('.sidebar #library-add');
            const sidebar = document.querySelector('.sidebar');
            const fab = document.getElementById('p2p-fab');
            const status = document.querySelector('.prism-status-bar');
            const pet = document.querySelector('.pet');
            const cardRect = card?.getBoundingClientRect();
            const iconRect = icon?.getBoundingClientRect();
            const labelRect = label?.getBoundingClientRect();
            const labelLineClamp = label ? getComputedStyle(label).webkitLineClamp : 'missing';
            const fabRect = fab?.getBoundingClientRect();
            const statusRect = status?.getBoundingClientRect();
            return {
              cardDisplay: card ? getComputedStyle(card).display : 'missing',
              cardDirection: card ? getComputedStyle(card).flexDirection : 'missing',
              labelBelowIcon: !!iconRect && !!labelRect && labelRect.top >= iconRect.bottom - 1,
              labelLineClamp,
              labelInsideCard: !!cardRect && !!labelRect
                && labelRect.left >= cardRect.left - 1 && labelRect.right <= cardRect.right + 1,
              addAfterContent: add ? getComputedStyle(add, '::after').content : 'missing',
              addButtonText: add?.textContent?.trim() ?? 'missing',
              addButtonWidth: add?.getBoundingClientRect().width ?? 0,
              sidebarOverflow: !!sidebar && sidebar.scrollWidth > sidebar.clientWidth + 2,
              petDisplay: pet ? getComputedStyle(pet).display : 'missing',
              p2pInOverflow: fab?.parentElement?.id === 'prism-toolbar-overflow',
              p2pPosition: fab ? getComputedStyle(fab).position : 'missing',
              documentOverflow: document.documentElement.scrollWidth > window.innerWidth + 2,
            };
          });
          console.log('PRISM DESKTOP GEOMETRY:', JSON.stringify(prismGeometry));
          if (prismGeometry.cardDisplay !== 'flex'
              || prismGeometry.cardDirection !== 'column'
              || !prismGeometry.labelBelowIcon
              || prismGeometry.labelLineClamp !== '2'
              || !prismGeometry.labelInsideCard
              || prismGeometry.addAfterContent !== 'none'
              || prismGeometry.addButtonText !== 'Добавить экземпляр…'
              || prismGeometry.addButtonWidth < 140
              || prismGeometry.sidebarOverflow
              || prismGeometry.petDisplay !== 'none'
              || !prismGeometry.p2pInOverflow
              || prismGeometry.p2pPosition !== 'static'
              || prismGeometry.documentOverflow) {
            throw new Error('Prism desktop geometry is broken; refusing to publish misleading screenshots.');
          }

          // Assert the literal left-to-right order and measured spacing from the supplied Pinecone reference.
          const toolbarOrder = await page.evaluate(() => {
            const ids = ['library-add', 'prism-open-folder', 'nav-settings-button', 'prism-help', 'prism-update'];
            return ids.map((id) => {
              const el = document.getElementById(id);
              const rect = el?.getBoundingClientRect();
              const style = el ? getComputedStyle(el) : null;
              return {
                id,
                left: rect?.left ?? null,
                right: rect?.right ?? null,
                visible: !!rect && rect.width > 0 && rect.height > 0 && style.display !== 'none',
              };
            });
          });
          const expectedToolbarIds = ['library-add', 'prism-open-folder', 'nav-settings-button', 'prism-help', 'prism-update'];
          console.log('PRISM TOOLBAR ORDER:', JSON.stringify(toolbarOrder));
          if (toolbarOrder.some((item, index) =>
                !item.visible
                || item.id !== expectedToolbarIds[index]
                || (index > 0 && item.left < toolbarOrder[index - 1].right - 1))
              || toolbarOrder[0].left > 12
              || toolbarOrder[0].right - toolbarOrder[0].left < 140) {
            throw new Error('Prism toolbar order is wrong or Add Instance text is hidden/clipped.');
          }

          await page.mouse.move(820, 450);
          await page.screenshot({
            path: 'artifacts/ui/prism-pinecone-desktop.png',
            fullPage: true,
          });

          // Capture the real Folders menu from the Pinecone reference and verify the functional destinations.
          await page.locator('#prism-open-folder').click();
          const foldersMenuState = await page.evaluate(() => ({
            visible: !document.getElementById('prism-folders-menu')?.hidden,
            labels: [...document.querySelectorAll('#prism-folders-menu [role="menuitem"]')].map((item) => item.querySelector('.prism-menu-item-label')?.textContent.trim() || item.textContent.trim()),
          }));
          console.log('PRISM FOLDERS MENU:', JSON.stringify(foldersMenuState));
          const expectedFolderLabels = [
            'Корневая папка лаунчера', 'Экземпляры', 'Основная папка модов', 'Скины', 'Java',
            'Набор значков', 'Темы для виджетов', 'Наборы котиков', 'Значки экземпляров', 'Журналы',
          ];
          if (!foldersMenuState.visible || foldersMenuState.labels.join('|') !== expectedFolderLabels.join('|')) {
            throw new Error('Prism Folders menu does not match the reference destinations.');
          }
          await page.screenshot({ path: 'artifacts/ui/prism-folders-menu.png', fullPage: true });
          await page.keyboard.press('Escape');
          if (await page.locator('#prism-folders-menu').evaluate((el) => !el.hidden)) {
            throw new Error('Prism Folders menu did not close on Escape.');
          }

          // Help is a drop-down menu, not a direct navigation link; all rows are End Launcher-owned actions.
          await page.locator('#prism-help').click();
          const helpMenuState = await page.evaluate(() => ({
            visible: !document.getElementById('prism-help-menu')?.hidden,
            labels: [...document.querySelectorAll('#prism-help-menu [role="menuitem"]')].map((item) => item.querySelector('.prism-menu-item-label')?.textContent.trim() || item.textContent.trim()),
          }));
          console.log('PRISM HELP MENU:', JSON.stringify(helpMenuState));
          const expectedHelpLabels = [
            'Обновить метаданные версий', 'Сообщить об ошибке или предложить функцию', 'Просмотр журналов',
            'Обсуждения', 'Новости и релизы', 'Справка', 'О проекте',
          ];
          if (!helpMenuState.visible || helpMenuState.labels.join('|') !== expectedHelpLabels.join('|')) {
            throw new Error('Prism Help menu does not expose the expected project actions.');
          }
          await page.screenshot({ path: 'artifacts/ui/prism-help-menu.png', fullPage: true });
          await page.keyboard.press('Escape');
          if (await page.locator('#prism-help-menu').evaluate((el) => !el.hidden)) {
            throw new Error('Prism Help menu did not close on Escape.');
          }

          await page.setViewportSize({ width: 390, height: 844 });
          await page.mouse.move(320, 420);
          await page.waitForTimeout(250);
          const prismMobileGeometry = await page.evaluate(() => {
            const root = document.documentElement;
            const layout = document.querySelector('.layout');
            const sidebar = document.querySelector('.sidebar');
            const main = document.querySelector('.content main');
            const playbar = document.querySelector('.playbar');
            const status = document.querySelector('.prism-status-bar');
            const fab = document.getElementById('p2p-fab');
            const pet = document.querySelector('.pet');
            const rect = (element) => {
              if (!element) return null;
              const r = element.getBoundingClientRect();
              return { top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height };
            };
            const activeCard = document.querySelector('#library .inst-card.active:not(.add)');
            const iconRect = rect(activeCard?.querySelector(':scope > .inst-icon'));
            const labelRect = rect(activeCard?.querySelector(':scope > .inst-name'));
            return {
              viewportWidth: innerWidth,
              documentWidth: root.scrollWidth,
              layout: rect(layout),
              sidebar: rect(sidebar),
              main: rect(main),
              playbar: rect(playbar),
              status: rect(status),
              p2pFab: rect(fab),
              petDisplay: pet ? getComputedStyle(pet).display : 'missing',
              p2pInOverflow: fab?.parentElement?.id === 'prism-toolbar-overflow',
              p2pPosition: fab ? getComputedStyle(fab).position : 'missing',
              tileColumn: activeCard ? getComputedStyle(activeCard).flexDirection : 'missing',
              labelLineClamp: activeCard ? getComputedStyle(activeCard.querySelector(':scope > .inst-name')).webkitLineClamp : 'missing',
              labelBelowIcon: !!iconRect && !!labelRect && labelRect.top >= iconRect.bottom - 1,
              playbarContained: !!playbar && playbar.scrollWidth <= playbar.clientWidth + 2,
              playbarVerticalFit: !!playbar && playbar.scrollHeight <= playbar.clientHeight + 2,
              playbarScrollHeight: playbar?.scrollHeight ?? 0,
              playbarClientHeight: playbar?.clientHeight ?? 0,
              layoutContained: !!layout && layout.scrollWidth <= layout.clientWidth + 2,
            };
          });
          console.log('PRISM MOBILE GEOMETRY:', JSON.stringify(prismMobileGeometry));
          const mobileToolbarOrder = await page.evaluate(() => {
            const ids = ['library-add', 'prism-open-folder', 'nav-settings-button', 'prism-help', 'prism-update'];
            return ids.map((id) => {
              const el = document.getElementById(id);
              const rect = el?.getBoundingClientRect();
              const style = el ? getComputedStyle(el) : null;
              return { id, top: rect?.top ?? null, left: rect?.left ?? null, visible: !!rect && rect.width > 0 && rect.height > 0 && style.display !== 'none' };
            });
          });
          const mobileVisualReadingOrder = [...mobileToolbarOrder]
            .sort((a, b) => a.top - b.top || a.left - b.left)
            .map((item) => item.id);
          console.log('PRISM MOBILE TOOLBAR ORDER:', JSON.stringify({ measured: mobileToolbarOrder, readingOrder: mobileVisualReadingOrder }));
          if (mobileToolbarOrder.some((item) => !item.visible)
              || mobileVisualReadingOrder.join(',') !== 'library-add,prism-open-folder,nav-settings-button,prism-help,prism-update') {
            throw new Error('Prism mobile toolbar order drifted from the Pinecone reference.');
          }
          const mobilePlaybar = prismMobileGeometry.playbar;
          const mobileStatus = prismMobileGeometry.status;
          if (prismMobileGeometry.documentWidth > 392
              || prismMobileGeometry.tileColumn !== 'column'
              || prismMobileGeometry.labelLineClamp !== '2'
              || !prismMobileGeometry.labelBelowIcon
              || !prismMobileGeometry.playbarContained
              || !prismMobileGeometry.playbarVerticalFit
              || !prismMobileGeometry.layoutContained
              || prismMobileGeometry.petDisplay !== 'none'
              || !prismMobileGeometry.p2pInOverflow
              || prismMobileGeometry.p2pPosition !== 'static'
              || !mobilePlaybar || !mobileStatus
              || mobilePlaybar.right > 392
              || mobileStatus.right > 392
              || mobilePlaybar.bottom > mobileStatus.top + 2
              || mobileStatus.bottom > 846) {
            throw new Error('Prism mobile layout overflows or clips the launch/status panels; refusing to publish screenshots.');
          }
          await page.screenshot({
            path: 'artifacts/ui/prism-pinecone-mobile.png',
            fullPage: true,
          });


          // Exercise the newly added in-app instance wizard, import hand-off, provider actions and settings tabs.
          await page.setViewportSize({ width: 1440, height: 900 });
          await page.evaluate(async () => { await window.__EL_TEST__.openNewInstance(); });
          await page.waitForTimeout(120);
          const wizardState = await page.evaluate(() => ({
            visible: getComputedStyle(document.getElementById('new-instance')).display !== 'none',
            title: document.getElementById('create-instance-title')?.textContent,
            providerLabels: [...document.querySelectorAll('#new-instance [data-create-view] > span:last-child')].map((item) => item.textContent.trim()),
            sidebarButtons: document.querySelectorAll('#new-instance [data-create-view]').length,
            versionRows: document.querySelectorAll('#ni-version-rows tr[data-version]').length,
            versionHeaders: [...document.querySelectorAll('.prism-version-table thead th')].map((item) => item.textContent.trim()),
            firstReleaseDate: document.querySelector('#ni-version-rows tr[data-version] .prism-version-release-date')?.textContent.trim(),
            releaseTypeRows: [...document.querySelectorAll('#ni-version-rows tr[data-version]')].map((row) => row.dataset.kind),
            versionSearch: (() => {
              const r = document.querySelector('.prism-version-search-row')?.getBoundingClientRect();
              return r ? { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height } : null;
            })(),
            loaderField: (() => {
              // The native select is intentionally hidden; measure the visible custom radio chooser.
              const r = document.querySelector('.prism-create-loader-field .prism-loader-options')?.getBoundingClientRect();
              return r ? { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height } : null;
            })(),
            loaderOptionCount: document.querySelectorAll('.prism-create-loader-field .prism-loader-option').length,
            selectedLoader: document.querySelector('.prism-create-loader-field input[name="prism-loader-choice"]:checked')?.value || '',
            loaderVersionRows: document.querySelectorAll('#ni-loader-version-rows tr[data-loader-version]').length,
            loaderVersionHeaders: [...document.querySelectorAll('.prism-loader-version-table thead th')].map((item) => item.textContent.trim()),
            selectedLoaderVersion: document.querySelector('#ni-loader-version-rows tr[aria-selected="true"]')?.dataset.loaderVersion || '',
            vanillaFallbackVisible: (() => { const wrapper = document.querySelector('.prism-create-loader-field > .cselect:has(> #ni-loader)'); return !!wrapper && getComputedStyle(wrapper).display !== 'none' && wrapper.getBoundingClientRect().width > 0; })(),
            vanillaRadioVisible: [...document.querySelectorAll('.prism-create-loader-field input[type="radio"]')].some((input) => input.value === 'vanilla'),
            versionBrowserVisible: !!document.querySelector('.prism-version-browser') && getComputedStyle(document.querySelector('.prism-version-browser')).display !== 'none',
            overlayRect: (() => { const r = document.getElementById('new-instance').getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; })(),
            minecraftPanelVisible: !document.querySelector('[data-create-panel="minecraft"]')?.hidden,
            importPanelHidden: !!document.querySelector('[data-create-panel="import"]')?.hidden,
            versionOptions: document.getElementById('ni-version')?.options.length || 0,
          }));
          console.log('PRISM CREATE WIZARD ASSERTIONS:', JSON.stringify(wizardState));
          const expectedProviderLabels = [
            'Пользовательский', 'Импорт', 'ATLauncher', 'CurseForge', 'FTB',
            'FTB Legacy', 'Импорт из приложения FTB', 'Modrinth', 'Technic',
          ];
          if (!wizardState.visible || wizardState.title !== 'Добавить экземпляр'
              || wizardState.sidebarButtons !== 9
              || wizardState.providerLabels.join('|') !== expectedProviderLabels.join('|')
              || !wizardState.versionBrowserVisible || wizardState.versionRows !== 2
              || wizardState.versionHeaders.join('|') !== 'Версия|Выпущено|Тип'
              || !wizardState.firstReleaseDate
              || !wizardState.versionSearch || wizardState.versionSearch.width < 220 || wizardState.versionSearch.height < 20
              || !wizardState.loaderField || wizardState.loaderField.width < 70 || wizardState.loaderField.height < 40
